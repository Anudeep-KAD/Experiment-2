<!DOCTYPE html>
<html>
<head>
    <title>Product Filter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #faf9fb;
            padding: 40px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .filter-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        select {
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #e0e5eb;
            width: 250px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .card h2 {
            margin: 0 0 10px;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .tag {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            color: white;
        }

        .electronics {
            background: #557296;
        }

        .clothing {
            background: #84959a;
            color: #1e3a8a;
        }
    </style>
</head>

<body>

    <h1>Product Filter</h1>

    <div class="filter-box">
        <strong>Filter by:</strong>
        <select id="category" onchange="filterProducts()">
            <option value="all">All Products</option>
            <option value="electronics">Electronics</option>
            <option value="clothing">Clothing</option>
        </select>
    </div>

    <div class="products">

        <div class="card electronics">
            <h2>Wireless Headphones</h2>
            <div class="price">$129.99</div>
            <span class="tag electronics">electronics</span>
        </div>

        <div class="card clothing">
            <h2>Cotton T-Shirt</h2>
            <div class="price">$24.99</div>
            <span class="tag clothing">clothing</span>
        </div>

        <div class="card electronics">
            <h2>Bluetooth Speaker</h2>
            <div class="price">$89.99</div>
            <span class="tag electronics">electronics</span>
        </div>

        <div class="card electronics">
            <h2>Mobile Phones</h2>
            <div class="price">$99.99</div>
            <span class="tag electronics">electronics</span>
        </div>

        <div class="card clothing">
            <h2>Denim Jeans</h2>
            <div class="price">$59.99</div>
            <span class="tag clothing">clothing</span>
        </div>

        <!-- NEW PRINTED SHIRTS CARD -->
        <div class="card clothing">
            <h2>Printed Shirts</h2>
            <div class="price">$30.99</div>
            <span class="tag clothing">clothing</span>
        </div>

    </div>

    <script>
        function filterProducts() {
            var selected = document.getElementById("category").value;
            var cards = document.getElementsByClassName("card");

            for (var i = 0; i < cards.length; i++) {
                if (selected === "all") {
                    cards[i].style.display = "block";
                } else if (cards[i].classList.contains(selected)) {
                    cards[i].style.display = "block";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
